<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gapura Smart</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="https://i.ibb.co.com/4ZgWC66s/logogapura.png">
    <link rel="icon" type="image/png" href="https://i.ibb.co.com/4ZgWC66s/logogapura.png">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f3c2a"> 
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #e2e8f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; width: 100vw; overflow: hidden; }
        .chat-container { width: 100%; max-width: 480px; height: 100vh; background: #ffffff; display: flex; flex-direction: column; overflow: hidden; }
        .chat-header { background: #0f3c2a; color: #ffffff; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .header-brand { display: flex; align-items: center; gap: 12px; }
        .header-logo { width: 35px; height: 35px; background: white; border-radius: 8px; padding: 3px; }
        .header-brand h3 { font-size: 15px; }
        
        .ticker-wrap { background: #fef08a; width: 100%; height: 30px; line-height: 30px; padding-left: 15px; font-size: 11px; font-weight: 700; color: #854d0e; white-space: nowrap; overflow: hidden; }
        .ticker-content { display: inline-block; animation: ticker 25s linear infinite; }
        @keyframes ticker { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-100%, 0, 0); } }

        .chat-box { flex: 1; padding: 20px 16px; overflow-y: auto; background: #f8fafc; }
        .message-wrapper { display: flex; flex-direction: column; margin-bottom: 16px; }
        .ai-msg { background: #ffffff; padding: 12px 16px; border: 1px solid #e2e8f0; border-radius: 18px 18px 18px 4px; font-size: 13.5px; color: #334155; }
        
        .smart-menu-grid { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
        .smart-menu-btn { background: #f1f5f9; border: 1px solid #e2e8f0; color: #0f3c2a; padding: 10px; border-radius: 8px; font-size: 12px; font-weight: 700; text-align: left; cursor: pointer; }
        
        .checklist-item { display: flex; align-items: center; gap: 10px; margin-top: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
        .checklist-item input { width: 18px; height: 18px; accent-color: #0f3c2a; }
        
        .input-area { display: flex; padding: 12px; background: #ffffff; border-top: 1px solid #e2e8f0; gap: 6px; align-items: center; }
        .bot-action-btn { background: #f1f5f9; color: #0f3c2a; border: 1px solid #cbd5e1; height: 40px; padding: 0 12px; border-radius: 20px; font-size: 11px; font-weight: 700; cursor: pointer; }
        #user-input { flex: 1; padding: 10px 15px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 20px; outline: none; font-size: 13px; }
        .action-btn { background: #0f3c2a; color: white; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="header-brand">
                <img src="https://i.ibb.co.com/4ZgWC66s/logogapura.png" class="header-logo">
                <h3>Gapura Smart</h3>
            </div>
            <button style="background:none; border:none; color:white; font-size:18px;" id="theme-btn">🌙</button>
        </div>
        
        <div class="ticker-wrap"><div class="ticker-content">⚠️ OPERATIONAL ALERT: Bekerja dengan Mengikuti SOP | Utamakan Safety & Security </div></div>

        <div class="chat-box" id="chat-box">
            <div class="message-wrapper">
                <div class="message ai-msg">Halo GAPURA WARRIORS! 👋<br><br>Gunakan tombol di bawah untuk akses cepat Checklist atau Surat Edaran.</div>
            </div>
        </div>
        
        <div class="input-area">
            <button class="bot-action-btn" onclick="sendQuickReply('Circular')">📢 Circular</button>
            <button class="bot-action-btn" onclick="sendQuickReply('checklist')">📋 Checklist</button>
            <input type="text" id="user-input" placeholder="Tanya SOP..." autocomplete="off">
            <button class="action-btn" id="send-btn">➤</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        
        const checklistDatabase = [
            { title: "📋 Checklist Area Check-in", trigger: "chk_checkin", answer: "<b>📋 AREA CHECK-IN:</b><br><label class='checklist-item'><input type='checkbox'> Editing flight (H-48 Jam)</label><label class='checklist-item'><input type='checkbox'> Briefing</label><label class='checklist-item'><input type='checkbox'> Cek Perlengkapan</label><label class='checklist-item'><input type='checkbox'> Cek Sistem</label><label class='checklist-item'><input type='checkbox'> Timbangan 0</label>" },
            { title: "📋 Checklist Area Boarding Gate", trigger: "chk_gate", answer: "<b>📋 AREA BOARDING GATE:</b><br><label class='checklist-item'><input type='checkbox'> Persiapkan perlengkapan</label><label class='checklist-item'><input type='checkbox'> Alat Remote Parking</label><label class='checklist-item'><input type='checkbox'> Sistem (Komputer & Scanner)</label><label class='checklist-item'><input type='checkbox'> Layar FIDS</label><label class='checklist-item'><input type='checkbox'> Area Gate Rapi</label>" }
        ];

        const sopDatabase = [
            {
                keywords: ["powerbank", "pb", "baterai"],
                answer: "<b>1. Batasan Kapasitas (Wh) & Ketentuan:</b><ul>" +
                        "<li><b>Kapasitas < 100 Wh (≤ 20.000 mAh):</b> Bebas dibawa ke kabin.</li>" +
                        "<li><b>Kapasitas 100 – 160 Wh (20.000 – 32.000 mAh):</b> Wajib lapor dan butuh izin maskapai.</li>" +
                        "<li><b>Kapasitas > 160 Wh (> 32.000 mAh):</b> Dilarang keras dibawa.</li>" +
                        "<li><b>Label Pudar / Hilang:</b> Otomatis disita petugas.</li></ul><br>" +
                        "<b>2. Jumlah & Lokasi Penyimpanan:</b><ul>" +
                        "<li><b>Maksimal Jumlah:</b> Hanya boleh membawa maksimal 2 unit per penumpang.</li>" +
                        "<li><b>Wajib di Kabin:</b> Masuk tas jinjing/ransel, dilarang keras masuk bagasi check-in (kargo).</li>" +
                        "<li><b>Posisi Aman:</b> Simpan di bawah kursi atau kantong kursi depan, jangan di loker bagasi atas.</li></ul><br>" +
                        "<b>3. Aturan Selama Penerbangan:</b><ul>" +
                        "<li><b>Dilarang Digunakan:</b> Dilarang mengecas HP atau perangkat lain selama penerbangan.</li>" +
                        "<li><b>Dilarang Diecas:</b> Dilarang mengisi ulang daya powerbank di kursi pesawat.</li>" +
                        "<li><b>Wajib Cabut Kabel:</b> Lepas semua kabel dari powerbank untuk mencegah korsleting.</li></ul>"
            },
            {
                keywords: ["delay", "terlambat", "kompensasi"],
                answer: "<b>ATURAN PENANGANAN DELAY (PM 89/2015):</b><br><br>" +
                        "<b>1. Kompensasi Berdasarkan Durasi Delay:</b><ul>" +
                        "<li><b>30 – 60 menit:</b> Dapat minuman ringan.</li>" +
                        "<li><b>61 – 120 menit:</b> Dapat minuman + makanan ringan (snack).</li>" +
                        "<li><b>121 – 180 menit:</b> Dapat minuman + makanan berat.</li>" +
                        "<li><b>181 – 240 menit:</b> Dapat minuman + snack + makanan berat.</li>" +
                        "<li><b>Lebih dari 240 menit (4 Jam):</b> Ganti rugi tunai Rp300.000 per orang.</li>" +
                        "<li><b>Pembatalan Penerbangan:</b> Dialihkan ke penerbangan lain atau refund tiket 100%.</li></ul><br>" +
                        "<b>2. Fasilitas & Hak Tambahan Penumpang:</b><ul>" +
                        "<li><b>Hak Refund Sejak Awal:</b> Penumpang bisa meminta refund atau pindah maskapai jika delay sudah masuk kategori 61 menit ke atas.</li>" +
                        "<li><b>Delay > 6 Jam:</b> Maskapai wajib menyediakan hotel/penginapan gratis beserta transportasi jemputan jika harus menginap.</li></ul><br>" +
                        "<b>3. Ketentuan Pencairan Rp300.000:</b><ul>" +
                        "<li><b>Metode Bayar:</b> Bisa berupa uang tunai, voucher yang dapat dicairkan, atau transfer bank.</li>" +
                        "<li><b>Tenggat Waktu:</b> Wajib dibayarkan maskapai maksimal 3 x 24 jam sejak waktu delay.</li></ul><br>" +
                        "<b>4. Pengecualian Tanggung Jawab:</b><ul>" +
                        "<li>Maskapai bebas dari kewajiban ganti rugi hanya jika bisa membuktikan delay disebabkan faktor cuaca buruk atau masalah teknis operasional bandara.</li></ul>"
            }
        ];
        function addMessage(text) {
            const div = document.createElement('div');
            div.className = 'message-wrapper';
            div.innerHTML = `<div class="message ai-msg">${text}</div>`;
            chatBox.appendChild(div); chatBox.scrollTop = chatBox.scrollHeight;
        }

        function renderMenu() {
            let html = "<b>📂 MENU UTAMA:</b><div class='smart-menu-grid'>";
            checklistDatabase.forEach(i => html += `<button class='smart-menu-btn' onclick="sendQuickReply('${i.trigger}')">${i.title}</button>`);
            sopDatabase.forEach(i => html += `<button class='smart-menu-btn' onclick="sendQuickReply('${i.trigger}')">${i.title}</button>`);
            html += "</div>";
            return html;
        }

        function sendQuickReply(text) {
            if(text === 'checklist') {
                let html = "<b>📋 PILIH AREA:</b><div class='smart-menu-grid'>";
                checklistDatabase.forEach(i => html += `<button class='smart-menu-btn' onclick="sendQuickReply('${i.trigger}')">${i.title}</button>`);
                html += "</div>";
                addMessage(html);
            } else {
                let found = [...checklistDatabase, ...sopDatabase].find(x => x.trigger === text || (x.keywords && x.keywords.includes(text)));
                addMessage(found ? found.answer : renderMenu());
            }
        }

        function handleSend() {
            let val = userInput.value.toLowerCase().trim();
            if(!val) return;
            if(val.includes('menu')) addMessage(renderMenu());
            else sendQuickReply(val);
            userInput.value = '';
        }

        document.getElementById('send-btn').addEventListener('click', handleSend);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSend();
        });
    </script>
</body>
</html>
